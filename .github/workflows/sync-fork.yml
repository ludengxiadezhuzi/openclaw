name: Sync Fork (openclaw-safe)

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Sync upstream
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 先备份自己的 sync-fork.yml（必须在 reset 之前！）
          SYNC_FILE=".github/workflows/sync-fork.yml"
          if [ -f "$SYNC_FILE" ]; then
            cp "$SYNC_FILE" /tmp/sync-fork.yml
          fi

          # 2. 设置 upstream 并 fetch
          if git remote | grep -q upstream; then
            git remote set-url upstream https://github.com/openclaw/openclaw.git
          else
            git remote add upstream https://github.com/openclaw/openclaw.git
          fi
          git fetch upstream

          # 3. 获取默认分支并 checkout
          DEFAULT_BRANCH=$(git remote show upstream | grep 'HEAD branch' | awk '{print $NF}')
          echo "Branch: $DEFAULT_BRANCH"
          git checkout $DEFAULT_BRANCH

          # 4. 比较是否需要同步
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/$DEFAULT_BRANCH)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "Already up to date"
            exit 0
          fi

          # 5. 强制同步上游
          git reset --hard upstream/$DEFAULT_BRANCH

          # 6. 删除上游工作流，恢复自己的 sync-fork.yml
          rm -rf .github/workflows
          mkdir -p .github/workflows
          if [ -f /tmp/sync-fork.yml ]; then
            cp /tmp/sync-fork.yml "$SYNC_FILE"
          fi

          # 7. 提交变更
          git add -A
          git diff --cached --quiet || git commit -m "sync: upstream merged, upstream workflows removed"

      - name: Push
        run: git push origin HEAD --force
